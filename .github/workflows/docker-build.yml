name: Build Docker image

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Matarchive.Web/Dockerfile
          push: false
          load: false
          tags: matarchive:ci
          build-args: |
            APP_PORT=8077

